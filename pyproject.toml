[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finmix"
version = "0.1.0"
description = "Flexible finite mixture modeling"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "optimagic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.ruff.lint]
ignore = ["E501"]